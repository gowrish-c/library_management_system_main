{% extends 'base.html' %}{% block title %}Edit Book{% endblock %}
{% block content %}<h1 class="page-title">Edit Book</h1>
<div class="form-card"><form method="POST" action="{{ url_for('edit_book', book_id=book.id) }}" data-ajax="true" data-redirect="{{ url_for('books') }}">
<div class="form-group"><label>Title *</label><input type="text" name="title" value="{{ book.title }}" required></div>
<div class="form-group"><label>Author *</label><input type="text" name="author" value="{{ book.author }}" required></div>
<div class="form-row"><div class="form-group"><label>ISBN</label><input type="text" name="isbn" value="{{ book.isbn or '' }}"></div><div class="form-group"><label>Category</label><input type="text" name="category" value="{{ book.category or '' }}"></div></div>
<div class="form-group"><label>Number of Copies</label><input type="number" name="quantity" value="{{ book.quantity }}" min="1" required></div>
<div class="form-actions"><button class="btn btn-primary">Save Changes</button><a href="{{ url_for('books') }}" class="btn btn-outline">Cancel</a></div>
</form></div>{% endblock %}
