{% extends 'base.html' %}{% block title %}Add Book{% endblock %}
{% block content %}<h1 class="page-title">Add a New Book</h1>
<div class="form-card"><form method="POST" action="{{ url_for('add_book') }}" data-ajax="true" data-redirect="{{ url_for('books') }}">
<div class="form-group"><label>Title *</label><input type="text" name="title" required autofocus></div>
<div class="form-group"><label>Author *</label><input type="text" name="author" required></div>
<div class="form-row"><div class="form-group"><label>ISBN</label><input type="text" name="isbn"></div><div class="form-group"><label>Category</label><input type="text" name="category"></div></div>
<div class="form-group"><label>Number of Copies</label><input type="number" name="quantity" value="1" min="1" required></div>
<div class="form-actions"><button class="btn btn-primary">Add Book</button><a href="{{ url_for('books') }}" class="btn btn-outline">Cancel</a></div>
</form></div>{% endblock %}
